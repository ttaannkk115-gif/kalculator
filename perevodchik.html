<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Переводчик</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f0f4f9;
      color: #1f1f1f;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f4f9;
      flex-shrink: 0;
    }

    .logo-container {
      display: flex;
      align-items: center;
      font-size: 20px;
      font-weight: 500;
      color: #1f1f1f;
    }

    .main-card {
      flex: 1;
      background: #ffffff;
      margin: 4px 12px 8px 12px;
      border-radius: 24px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      overflow-y: auto;
      min-height: 0;
      position: relative;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      position: relative;
      flex-shrink: 0;
    }

    textarea {
      width: 100%;
      border: none;
      outline: none;
      font-size: 18px;
      color: #1f1f1f;
      resize: none;
      min-height: 110px;
      background: transparent;
      padding-right: 36px;
      line-height: 1.4;
    }

    textarea::placeholder {
      color: #747775;
      font-size: 18px;
    }

    .clear-btn {
      position: absolute;
      top: 0;
      right: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #f0f4f9;
      color: #444746;
      font-size: 16px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .clear-btn:active {
      background: #e1e9f5;
    }

    .paste-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: #c2e7ff;
      color: #001d35;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      width: fit-content;
      margin-top: 6px;
      flex-shrink: 0;
    }

    .translation-result {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #f1f3f4;
      display: none;
    }

    .translation-text {
      font-size: 18px;
      color: #0b57d0;
      font-weight: 400;
      word-break: break-word;
      white-space: pre-wrap;
      line-height: 1.4;
    }

    .copy-result-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: #f0f4f9;
      color: #0b57d0;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      width: fit-content;
      margin-top: 12px;
      transition: background-color 0.2s;
    }

    .copy-result-btn:active {
      background-color: #e1e9f5;
    }

    .bottom-panel {
      padding: 4px 16px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex-shrink: 0;
    }

    .language-selector {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .lang-pill {
      flex: 1;
      background: #ffffff;
      border-radius: 16px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      position: relative;
    }

    .lang-pill select {
      border: none;
      background: transparent;
      font-size: 15px;
      font-weight: 500;
      color: #1f1f1f;
      outline: none;
      width: 100%;
      height: 100%;
      text-align: center;
      text-align-last: center;
      appearance: none;
      cursor: pointer;
    }

    .swap-icon-btn {
      background: none;
      border: none;
      padding: 6px;
      color: #444746;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: #444746;
      font-size: 12px;
      font-weight: 500;
    }

    .circle-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #0b57d0;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      cursor: pointer;
    }

    .file-input {
      display: none;
    }

    .loader {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #0b57d0;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      animation: spin 0.8s linear infinite;
      display: none;
      margin-bottom: 8px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      Переводчик
    </div>
  </header>

  <div class="main-card">
    <div class="card-top">
      <textarea id="source-text" placeholder="Введите текст"></textarea>
      <button class="clear-btn" id="clear-btn" onclick="clearAll()">✕</button>
    </div>

    <button class="paste-btn" id="paste-btn" onclick="pasteFromClipboard()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#001d35"><path d="M19 2h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 16H5V4h2v3h10V4h2v14z"/></svg>
      Вставить
    </button>

    <div class="translation-result" id="translation-result">
      <div class="loader" id="text-loader"></div>
      <div class="translation-text" id="target-text"></div>
      
      <button class="copy-result-btn" id="copy-result-btn" style="display: none;" onclick="copyTranslation()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#0b57d0"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
        <span id="copy-btn-label">Копировать</span>
      </button>
    </div>
  </div>

  <div class="bottom-panel">
    <div class="language-selector">
      <div class="lang-pill">
        <select id="src-lang" onchange="handleLangChange()">
          <option value="auto">Определить</option>
          <option value="ru" selected>русский</option>
          <option value="en">английский</option>
          <option value="es">испанский</option>
          <option value="de">немецкий</option>
        </select>
      </div>

      <button class="swap-icon-btn" onclick="swapLanguages()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#444746"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
      </button>

      <div class="lang-pill">
        <select id="tgt-lang" onchange="handleLangChange()">
          <option value="en" selected>английский</option>
          <option value="ru">русский</option>
          <option value="es">испанский</option>
          <option value="de">немецкий</option>
        </select>
      </div>
    </div>

    <div class="action-buttons">
      <label for="gallery-file" class="action-item">
        <div class="circle-btn">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
        </div>
        Перевод с фото
      </label>
    </div>
  </div>

  <input type="file" id="gallery-file" class="file-input" accept="image/*" onchange="handleImage(this.files[0])">

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script>
    const sourceText = document.getElementById('source-text');
    const targetText = document.getElementById('target-text');
    const resultCard = document.getElementById('translation-result');
    const textLoader = document.getElementById('text-loader');
    const clearBtn = document.getElementById('clear-btn');
    const pasteBtn = document.getElementById('paste-btn');
    const copyResultBtn = document.getElementById('copy-result-btn');
    const copyBtnLabel = document.getElementById('copy-btn-label');

    let debounceTimer;

    sourceText.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      const text = sourceText.value.trim();

      if (text) {
        clearBtn.style.display = 'flex';
        pasteBtn.style.display = 'none';
        resultCard.style.display = 'block';
        textLoader.style.display = 'block';
        copyResultBtn.style.display = 'none';
        targetText.innerText = '';

        debounceTimer = setTimeout(() => {
          translateText(text);
        }, 300);
      } else {
        clearBtn.style.display = 'none';
        pasteBtn.style.display = 'inline-flex';
        resultCard.style.display = 'none';
      }
    });

    async function translateText(text) {
      const src = document.getElementById('src-lang').value;
      const tgt = document.getElementById('tgt-lang').value;

      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${src}&tl=${tgt}&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        
        if (data && data[0]) {
          const translatedParts = data[0].map(item => item[0]).join('');
          targetText.innerText = translatedParts;
          copyResultBtn.style.display = 'inline-flex';
        } else {
          targetText.innerText = 'Ошибка перевода';
          copyResultBtn.style.display = 'none';
        }
      } catch (err) {
        targetText.innerText = 'Ошибка сети';
        copyResultBtn.style.display = 'none';
      } finally {
        textLoader.style.display = 'none';
      }
    }

    async function copyTranslation() {
      const textToCopy = targetText.innerText.trim();
      if (!textToCopy) return;

      try {
        await navigator.clipboard.writeText(textToCopy);
        copyBtnLabel.innerText = 'Скопировано!';
        setTimeout(() => {
          copyBtnLabel.innerText = 'Копировать';
        }, 2000);
      } catch (err) {
        alert('Не удалось скопировать');
      }
    }

    function handleLangChange() {
      if (sourceText.value.trim()) {
        translateText(sourceText.value.trim());
      }
    }

    function clearAll() {
      sourceText.value = '';
      targetText.innerText = '';
      resultCard.style.display = 'none';
      clearBtn.style.display = 'none';
      copyResultBtn.style.display = 'none';
      pasteBtn.style.display = 'inline-flex';
      document.getElementById('gallery-file').value = '';
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        sourceText.value = text;
        sourceText.dispatchEvent(new Event('input'));
      } catch (err) {
        alert('Разрешите доступ к буферу обмена');
      }
    }

    function swapLanguages() {
      const src = document.getElementById('src-lang');
      const tgt = document.getElementById('tgt-lang');

      if (src.value === 'auto') return;

      const temp = src.value;
      src.value = tgt.value;
      tgt.value = temp;

      if (sourceText.value.trim()) {
        translateText(sourceText.value.trim());
      }
    }

    async function handleImage(file) {
      if (!file) return;

      sourceText.value = '';
      targetText.innerText = '';
      resultCard.style.display = 'block';
      textLoader.style.display = 'block';
      copyResultBtn.style.display = 'none';
      clearBtn.style.display = 'flex';
      pasteBtn.style.display = 'none';

      try {
        const src = document.getElementById('src-lang').value;
        const ocrLang = (src === 'ru') ? 'rus' : 'eng';

        const worker = await Tesseract.createWorker(ocrLang);
        const ret = await worker.recognize(file);
        await worker.terminate();

        const recognizedText = ret.data.text.trim();

        if (recognizedText) {
          sourceText.value = recognizedText;
          await translateText(recognizedText);
        } else {
          sourceText.value = 'Текст на фото не найден';
          textLoader.style.display = 'none';
        }
      } catch (e) {
        sourceText.value = 'Ошибка распознавания';
        textLoader.style.display = 'none';
      }
    }
  </script>
</body>
</html>
