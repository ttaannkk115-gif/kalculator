<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>VoltMaster</title>

<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0a;color:#e8edf5;padding-bottom:90px;font-size:16px;min-height:100vh}

header{background:#0a0a0a;padding:24px 18px 16px;text-align:center;border-bottom:1px solid #1c1c1e;position:sticky;top:0;z-index:10;backdrop-filter:blur(10px)}
header h1{font-size:18px;font-weight:800;letter-spacing:2px;color:#f59e0b;margin-bottom:10px;text-transform:uppercase}
.id-badge{display:inline-flex;align-items:center;gap:6px;background:#1a1a1c;border:1px solid #2c2c2e;padding:6px 14px;border-radius:20px;font-size:12px;color:#9ca3af;font-weight:600}
.id-dot{width:6px;height:6px;background:#f59e0b;border-radius:50%}
.sync-badge{display:inline-flex;align-items:center;gap:6px;background:#0c4a6e;border:1px solid #0369a1;padding:6px 14px;border-radius:20px;font-size:11px;color:#38bdf8;font-weight:700;margin-left:6px}
.sync-badge.active{background:#052e16;border-color:#166534;color:#4ade80}

.container{padding:16px}

.screen{display:none}
.screen.active{display:block}

.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.kpi{background:#161618;border:1px solid #222225;border-radius:16px;padding:14px}
.kpi .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:#9ca3af;font-weight:700;margin-bottom:6px}
.kpi .val{font-size:22px;font-weight:800;color:#fff}
.kpi .val.green{color:#22c55e}
.kpi .val.orange{color:#f59e0b}
.kpi .val.blue{color:#38bdf8}

.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;background:#161618;border:1px solid #222225;color:#9ca3af;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;transition:.15s}
.chip.active{background:#f59e0b;color:#000;border-color:#f59e0b}

.order{background:#161618;border:1px solid #222225;border-radius:16px;padding:14px;margin-bottom:10px;position:relative;overflow:hidden;animation:pop .3s ease;cursor:pointer;transition:all .2s}
.order:hover{border-color:#38bdf8;background:#1a1a1e}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.order::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.order.new::before{background:#38bdf8}
.order.progress::before{background:#f59e0b}
.order.done::before{background:#22c55e}
.order.paid::before{background:#a855f7}

.card-top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-top-left{display:flex;align-items:center;gap:8px}
.order .price-header{font-size:16px;font-weight:800;color:#22c55e}
.order .price-header.unpaid{color:#f59e0b}

.card-actions-top{display:flex;gap:4px}
.btn-action-mini{width:26px;height:26px;font-size:12px;background:#222225;color:#e8edf5;border:1px solid #2c2c35;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-action-mini.share{color:#38bdf8}
.btn-action-mini.del{color:#f87171}

.order-compact-grid{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;font-size:13px}
.compact-client{font-weight:700;color:#fff;font-size:15px}
.compact-phone{text-align:right}
.compact-phone a{color:#38bdf8;text-decoration:none;background:#0c4a6e;padding:2px 8px;border-radius:6px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:3px}

.compact-address{color:#93c5fd}
.compact-address a{color:#93c5fd;text-decoration:none;display:inline-flex;align-items:center;gap:3px}
.compact-advance{text-align:right;color:#86efac;font-weight:600;font-size:12px}

.compact-time{color:#9ca3af;font-size:11px}
.compact-finished{text-align:right;color:#9ca3af;font-size:11px}

.order-bottom-bar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed #222225}
.order .remainder{font-size:12px;font-weight:700;color:#f97316}

.order-toggle-hint{font-size:11px;color:#6b7280;font-weight:600;display:flex;align-items:center;gap:4px}
.order.expanded .order-toggle-hint span{transform:rotate(180deg)}
.order-toggle-hint span{display:inline-block;transition:transform .2s}

.order-details{display:none;margin-top:10px;padding-top:10px;border-top:1px solid #222225}
.order.expanded .order-details{display:block}

.order .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;background:#0a0a0a;color:#9ca3af;border:1px solid #222225;display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.tag.status-new{background:#082f49;color:#38bdf8;border-color:#0c4a6e}
.tag.status-progress{background:#3b2a06;color:#fbbf24;border-color:#78350f}
.tag.status-done{background:#052e16;color:#4ade80;border-color:#166534}
.tag.status-paid{background:#2e1065;color:#c084fc;border-color:#6b21a8}
.tag.urgent{background:#450a0a;color:#f87171;border-color:#7f1d1d}
.tag.mat-tag{background:#271c08;color:#fbbf24;border-color:#78350f}
.tag.partner-tag{background:#1e1b4b;color:#818cf8;border-color:#3730a3}

.order-desc{font-size:13px;color:#cbd5e1;margin-top:8px;background:#111113;padding:8px 10px;border-radius:8px;border:1px solid #1f1f23;white-space:pre-wrap}

.order-actions-row{display:flex;gap:8px;margin-top:10px;align-items:center}
.btn-status-long{flex:1;padding:11px;border-radius:10px;font-size:13px;font-weight:700;border:none;cursor:pointer;background:#f59e0b;color:#000;text-align:center}
.btn-icon{background:#1e1e24;color:#e8edf5;border:1px solid #2c2c35;width:41px;height:41px;border-radius:10px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;text-decoration:none}

.empty{text-align:center;padding:50px 20px;color:#6b7280;font-size:14px}
.empty span{font-size:52px;display:block;margin-bottom:12px;opacity:.5}

.archive-header{margin-bottom:16px;background:#161618;border:1px solid #222225;border-radius:16px;padding:16px;text-align:center}
.archive-header h2{font-size:18px;color:#fff;margin-bottom:4px}
.archive-header p{font-size:13px;color:#9ca3af;margin-bottom:12px}
.btn-clear-archive{background:#2a1215;color:#f87171;border:1px solid #7f1d1d;padding:8px 16px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:none;align-items:flex-end;backdrop-filter:blur(4px)}
.modal-bg.show{display:flex}
.modal{background:#161618;width:100%;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:22px 18px 30px;border-top:1px solid #222225}
.modal h2{font-size:19px;color:#fff;margin-bottom:4px;font-weight:700}
.modal .sub{font-size:13px;color:#9ca3af;margin-bottom:16px}

label{display:block;font-size:11px;font-weight:700;color:#9ca3af;margin-bottom:6px;margin-top:14px;text-transform:uppercase;letter-spacing:.5px}
label:first-of-type{margin-top:0}
.required-mark{color:#f87171;margin-left:3px}

input,select,textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #222225;font-size:16px;background:#0a0a0a;color:#e8edf5;-webkit-appearance:none;appearance:none;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#f59e0b}
textarea{resize:vertical;min-height:70px}

.checkbox-row{display:flex;align-items:center;gap:12px;margin-top:12px;background:#0a0a0a;padding:12px 14px;border-radius:12px;border:1px solid #222225;cursor:pointer;user-select:none}
.checkbox-row input[type="checkbox"]{position:absolute;opacity:0;cursor:pointer;height:0;width:0}
.custom-checkbox{width:22px;height:22px;background:#111113;border:2px solid #333338;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .15s ease;flex-shrink:0}
.checkbox-row input[type="checkbox"]:checked ~ .custom-checkbox{background:#f59e0b;border-color:#f59e0b}
.custom-checkbox::after{content:"";display:none;width:6px;height:11px;border:solid #000;border-width:0 2.5px 2.5px 0;-webkit-transform:rotate(45deg);transform:rotate(45deg);margin-bottom:2px}
.checkbox-row input[type="checkbox"]:checked ~ .custom-checkbox::after{display:block}
.checkbox-row label{margin:0;cursor:pointer;color:#e8edf5;text-transform:none;font-size:14px;font-weight:500}

.type-toggle{display:flex;gap:6px;margin-top:6px}
.type-btn{flex:1;padding:10px;border-radius:10px;border:1px solid #222225;background:#0a0a0a;color:#9ca3af;font-size:12px;font-weight:700;cursor:pointer;text-align:center}
.type-btn.active{background:#f59e0b;color:#000;border-color:transparent}

.priority-row{display:flex;gap:8px;margin-top:6px}
.priority-btn{flex:1;padding:11px;border-radius:12px;border:1px solid #222225;background:#0a0a0a;color:#9ca3af;font-size:13px;font-weight:700;cursor:pointer}
.priority-btn.active{background:#f59e0b;color:#000;border-color:transparent}

.modal-actions{display:flex;gap:8px;margin-top:22px}
.modal-actions button{flex:1;padding:15px;border-radius:14px;font-size:15px;font-weight:700;border:none;cursor:pointer}
.btn-save{background:#f59e0b;color:#000}
.btn-cancel{background:#0a0a0a;color:#9ca3af;border:1px solid #222225}

.nav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid #1c1c1e;display:flex;padding:10px 0 16px;z-index:40}
.nav-item{flex:1;text-align:center;color:#6b7280;font-size:10px;font-weight:700;cursor:pointer;padding:4px;text-transform:uppercase;letter-spacing:.5px}
.nav-item.active{color:#f59e0b}
.nav-item .ico{font-size:20px;display:block;margin-bottom:3px}
</style>
</head>
<body>

<header>
    <h1>VoltMaster</h1>
    <div>
        <div class="id-badge">
            <span class="id-dot"></span>
            <span id="userIdBadge">ID: ----</span>
        </div>
        <div class="sync-badge" id="syncBadge" style="display:none;">
            <span>☁️ Синхронизация</span>
        </div>
    </div>
</header>

<div class="container">
    <div id="screenOrders" class="screen active">
        <div class="kpi-grid">
            <div class="kpi">
                <div class="lbl">Активных</div>
                <div class="val blue" id="kpiActive">0</div>
            </div>
            <div class="kpi">
                <div class="lbl">Заработано (моё)</div>
                <div class="val green" id="kpiPaid">0 ₽</div>
            </div>
            <div class="kpi">
                <div class="lbl">Ждёт оплаты</div>
                <div class="val orange" id="kpiUnpaid">0 ₽</div>
            </div>
            <div class="kpi">
                <div class="lbl">Средний чек</div>
                <div class="val" id="kpiAvg">0 ₽</div>
            </div>
        </div>

        <div class="filters" id="filters">
            <div class="chip active" data-f="all">Все</div>
            <div class="chip" data-f="new">🔵 Новые</div>
            <div class="chip" data-f="progress">🟡 В работе</div>
            <div class="chip" data-f="done">🟢 Выполнены</div>
            <div class="chip" data-f="urgent">🔥 Срочные</div>
        </div>

        <div id="ordersList"></div>
    </div>

    <div id="screenArchive" class="screen">
        <div class="archive-header">
            <h2>🗄️ Архив заказов</h2>
            <p id="archiveSub">Оплаченные выполненные работы</p>
            <button class="btn-clear-archive" onclick="clearArchive()">🗑 Очистить архив</button>
        </div>
        <div id="archiveList"></div>
    </div>
</div>

<nav class="nav">
    <div class="nav-item active" id="navOrders" onclick="switchScreen('orders', this)">
        <span class="ico">📋</span>Заказы
    </div>
    <div class="nav-item" onclick="openModal()">
        <span class="ico">＋</span>Создать
    </div>
    <div class="nav-item" id="navArchive" onclick="switchScreen('archive', this)">
        <span class="ico">📁</span>Архив
    </div>
</nav>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modalContentBox" onclick="event.stopPropagation()">
        <h2 id="modalTitle">Новый заказ</h2>
        <p class="sub" id="modalSub">Заполните данные о заказе</p>

        <label>Клиент <span class="required-mark">*</span></label>
        <input type="text" id="fClient" placeholder="Имя / компания">

        <label>Телефон клиента</label>
        <input type="tel" id="fPhone" placeholder="+7 ..." inputmode="tel">

        <label>Адрес объекта <span class="required-mark">*</span></label>
        <input type="text" id="fAddress" placeholder="Улица, дом, квартира">

        <div style="display:flex;gap:10px">
            <div style="flex:1">
                <label>Стоимость работ (₽) <span class="required-mark">*</span></label>
                <input type="number" id="fPrice" placeholder="0" min="0" step="1" inputmode="decimal">
            </div>
            <div style="flex:1">
                <label>Аванс (₽)</label>
                <input type="number" id="fAdvance" placeholder="0" min="0" step="1" inputmode="decimal">
            </div>
        </div>

        <div class="checkbox-row" onclick="toggleCheckbox('fMaterialUnpaid'); onMaterialCheckboxChange()">
            <input type="checkbox" id="fMaterialUnpaid" onchange="onMaterialCheckboxChange()">
            <div class="custom-checkbox"></div>
            <label for="fMaterialUnpaid">Клиент не оплатил материал</label>
        </div>

        <div id="materialDebtWrapper" style="display:none; margin-top:10px;">
            <label>Сумма долга за материал (₽)</label>
            <input type="number" id="fMaterialDebt" placeholder="0" min="0" step="1" inputmode="decimal">
        </div>

        <div class="checkbox-row" onclick="toggleCheckbox('fHasPartner'); onPartnerCheckboxChange()" style="margin-top:14px;">
            <input type="checkbox" id="fHasPartner" onchange="onPartnerCheckboxChange()">
            <div class="custom-checkbox"></div>
            <label for="fHasPartner">Работа с напарником</label>
        </div>

        <div id="partnerDetailsWrapper" style="display:none; margin-top:10px;">
            <label>Тип расчета напарника</label>
            <div class="type-toggle">
                <button type="button" class="type-btn active" id="partnerTypePercent" onclick="setPartnerType('percent')">Процент (%)</button>
                <button type="button" class="type-btn" id="partnerTypeFixed" onclick="setPartnerType('fixed')">Сумма (₽)</button>
            </div>

            <div id="partnerPercentRow" style="margin-top:10px;">
                <label>Процент напарнику (%)</label>
                <input type="number" id="fPartnerPercent" placeholder="50" min="0" max="100" step="1" inputmode="decimal" value="50">
            </div>

            <div id="partnerFixedRow" style="display:none; margin-top:10px;">
                <label>Сумма напарнику (₽)</label>
                <input type="number" id="fPartnerFixed" placeholder="0" min="0" step="1" inputmode="decimal">
            </div>
        </div>

        <label>Приоритет</label>
        <div class="priority-row">
            <button class="priority-btn active" data-p="normal" onclick="setPriority('normal')">Обычный</button>
            <button class="priority-btn" data-p="urgent" onclick="setPriority('urgent')">🔥 Срочный</button>
        </div>

        <label>Статус</label>
        <select id="fStatus">
            <option value="new">🔵 Новый</option>
            <option value="progress">🟡 В работе</option>
            <option value="done">🟢 Выполнен</option>
            <option value="paid">🟣 Оплачен</option>
        </select>

        <label>Заметки / Договорённости</label>
        <textarea id="fDescription" placeholder="Подробное описание задачи..."></textarea>

        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">Отмена</button>
            <button class="btn-save" onclick="saveOrder()">Сохранить</button>
        </div>
    </div>
</div>

<script>
// ============ ОПРЕДЕЛЕНИЕ ID И РЕЖИМА СИНХРОНИЗАЦИИ ============
var userID = localStorage.getItem('volt_master_uid') || Math.floor(1000 + Math.random() * 9000).toString();
localStorage.setItem('volt_master_uid', userID);
document.getElementById('userIdBadge').textContent = 'ID: ' + userID;

// Режим синхронизации: только для ID '05'
var CLOUD_ID = '05';
var USE_CLOUD = (userID === CLOUD_ID);

// Показываем значок синхронизации если облако
if (USE_CLOUD) {
    var badge = document.getElementById('syncBadge');
    badge.style.display = 'inline-flex';
    badge.classList.add('active');
}

// ============ FIREBASE (только для ID 05) ============
var database = null;
if (USE_CLOUD) {
    try {
        var firebaseConfig = {
            apiKey: "AIzaSyD-dIC8bm8y4kaY7RXmMrys2wOMALA5o8vY",
            authDomain: "voltmaster-332c0.firebaseapp.com",
            databaseURL: "https://voltmaster-332c0-default-rtdb.firebaseio.com",
            projectId: "voltmaster-332c0",
            storageBucket: "voltmaster-332c0.firebasestorage.app",
            messagingSenderId: "312337098429",
            appId: "1:312337098429:web:663e0f6787bd62d19bf9d4"
        };
        firebase.initializeApp(firebaseConfig);
        database = firebase.database();
    } catch (e) {
        console.error('Firebase error:', e);
        USE_CLOUD = false;
    }
}

// ============ ДАННЫЕ ============
var orders = [];
var currentFilter = 'all';
var editingId = null;
var currentPriority = 'normal';
var partnerCalcType = 'percent';
var activeScreen = 'orders';
var dataLoaded = false;

var STATUS_LABEL = {
    new:      { txt:'🔵 Новый',     cls:'status-new' },
    progress: { txt:'🟡 В работе',  cls:'status-progress' },
    done:     { txt:'🟢 Выполнен',  cls:'status-done' },
    paid:     { txt:'🟣 Оплачен',   cls:'status-paid' }
};

var NEXT_STATUS = { new: 'progress', progress: 'done', done: 'paid', paid: 'new' };
var STATUS_TEXT = { new: 'Новый', progress: 'В работе', done: 'Выполнен', paid: 'Оплачен' };

// ============ СОХРАНЕНИЕ И ЗАГРУЗКА ============
function save() {
    if (USE_CLOUD && database) {
        // Сохраняем в Firebase
        database.ref('users/' + CLOUD_ID + '/zakazi').set(orders)
            .then(function() { /* успешно */ })
            .catch(function(err) {
                console.error('Firebase save error:', err);
                alert('Ошибка синхронизации: ' + err.message);
            });
    } else {
        // Обычное сохранение в браузере
        localStorage.setItem('voltmaster_crm', JSON.stringify(orders));
    }
    render();
}

function loadData(callback) {
    if (USE_CLOUD && database) {
        // Проверяем, есть ли уже что-то в облаке
        database.ref('users/' + CLOUD_ID + '/zakazi').once('value').then(function(snap) {
            var cloudData = snap.val();
            if (cloudData && cloudData.length) {
                // В облаке уже есть данные — используем их
                orders = cloudData;
                dataLoaded = true;
                if (callback) callback();
                render();
            } else {
                // В облаке пусто — проверяем локальные данные
                var localData = JSON.parse(localStorage.getItem('voltmaster_crm') || '[]');
                if (localData && localData.length > 0) {
                    // Есть локальные — переносим их в облако
                    orders = localData;
                    database.ref('users/' + CLOUD_ID + '/zakazi').set(orders).then(function() {
                        dataLoaded = true;
                        if (callback) callback();
                        render();
                    });
                } else {
                    orders = [];
                    dataLoaded = true;
                    if (callback) callback();
                    render();
                }
            }
        }).catch(function(err) {
            console.error('Firebase load error:', err);
            // При ошибке — fallback на localStorage
            orders = JSON.parse(localStorage.getItem('voltmaster_crm') || '[]');
            dataLoaded = true;
            if (callback) callback();
            render();
        });
    } else {
        // Обычная загрузка из браузера
        orders = JSON.parse(localStorage.getItem('voltmaster_crm') || '[]');
        dataLoaded = true;
        if (callback) callback();
        render();
    }
}

// ============ РЕАЛЬНОЕ ВРЕМЯ (только для ID 05) ============
if (USE_CLOUD && database) {
    database.ref('users/' + CLOUD_ID + '/zakazi').on('value', function(snap) {
        var data = snap.val();
        if (data && Array.isArray(data)) {
            // Обновляем локальный массив только если не идёт редактирование
            if (!editingId) {
                orders = data;
                render();
            }
        }
    });
}

// ============ ОСТАЛЬНОЙ КОД (без изменений) ============
function switchScreen(screenName, el){
    activeScreen = screenName;
    document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
    document.querySelectorAll('.nav-item').forEach(function(n){ n.classList.remove('active'); });

    if(screenName === 'orders'){
        document.getElementById('screenOrders').classList.add('active');
        document.getElementById('navOrders').classList.add('active');
    } else if(screenName === 'archive'){
        document.getElementById('screenArchive').classList.add('active');
        document.getElementById('navArchive').classList.add('active');
    }
    render();
}

function toggleCheckbox(id){
    var chk = document.getElementById(id);
    if(chk){ chk.checked = !chk.checked; }
}

function onMaterialCheckboxChange(){
    var chk = document.getElementById('fMaterialUnpaid');
    var wrap = document.getElementById('materialDebtWrapper');
    wrap.style.display = chk.checked ? 'block' : 'none';
    if(!chk.checked){ document.getElementById('fMaterialDebt').value = ''; }
}

function onPartnerCheckboxChange(){
    var chk = document.getElementById('fHasPartner');
    var wrap = document.getElementById('partnerDetailsWrapper');
    wrap.style.display = chk.checked ? 'block' : 'none';
    if(!chk.checked){
        document.getElementById('fPartnerPercent').value = '50';
        document.getElementById('fPartnerFixed').value = '';
    }
}

function setPartnerType(type){
    partnerCalcType = type;
    document.getElementById('partnerTypePercent').classList.toggle('active', type === 'percent');
    document.getElementById('partnerTypeFixed').classList.toggle('active', type === 'fixed');
    document.getElementById('partnerPercentRow').style.display = type === 'percent' ? 'block' : 'none';
    document.getElementById('partnerFixedRow').style.display = type === 'fixed' ? 'block' : 'none';
}

function openModal(id){
    editingId = id || null;
    currentPriority = 'normal';
    partnerCalcType = 'percent';
    setPartnerType('percent');

    document.getElementById('modalTitle').textContent = id ? 'Редактировать заказ' : 'Новый заказ';
    document.getElementById('modalSub').textContent = id ? 'Измените данные' : 'Заполните данные о заказе';

    if(id){
        var o = null;
        for (var i = 0; i < orders.length; i++) if (orders[i].id === id) o = orders[i];
        if(!o) return;
        document.getElementById('fClient').value = o.client || '';
        document.getElementById('fPhone').value = o.phone || '';
        document.getElementById('fAddress').value = o.address || '';
        document.getElementById('fPrice').value = o.price || '';
        document.getElementById('fAdvance').value = o.advance || '';

        var hasMatDebt = (o.materialDebt && o.materialDebt > 0);
        document.getElementById('fMaterialUnpaid').checked = hasMatDebt;
        document.getElementById('fMaterialDebt').value = hasMatDebt ? o.materialDebt : '';
        document.getElementById('materialDebtWrapper').style.display = hasMatDebt ? 'block' : 'none';

        var hasPartner = !!o.hasPartner;
        document.getElementById('fHasPartner').checked = hasPartner;
        document.getElementById('partnerDetailsWrapper').style.display = hasPartner ? 'block' : 'none';

        if(hasPartner){
            partnerCalcType = o.partnerType || 'percent';
            setPartnerType(partnerCalcType);
            document.getElementById('fPartnerPercent').value = o.partnerPercent !== undefined ? o.partnerPercent : 50;
            document.getElementById('fPartnerFixed').value = o.partnerFixed || '';
        } else {
            document.getElementById('fPartnerPercent').value = '50';
            document.getElementById('fPartnerFixed').value = '';
        }

        document.getElementById('fStatus').value = o.status || 'new';
        document.getElementById('fDescription').value = o.description || '';
        currentPriority = o.priority || 'normal';
    } else {
        ['fClient','fPhone','fAddress','fPrice','fAdvance','fMaterialDebt','fPartnerFixed','fDescription'].forEach(function(i){ document.getElementById(i).value=''; });
        document.getElementById('fMaterialUnpaid').checked = false;
        document.getElementById('materialDebtWrapper').style.display = 'none';

        document.getElementById('fHasPartner').checked = false;
        document.getElementById('fPartnerPercent').value = '50';
        document.getElementById('partnerDetailsWrapper').style.display = 'none';

        document.getElementById('fStatus').value = 'new';
    }
    updatePriorityBtns();
    document.getElementById('modalBg').classList.add('show');

    var modalBox = document.getElementById('modalContentBox');
    if(modalBox) modalBox.scrollTop = 0;
}

function closeModal(){
    document.getElementById('modalBg').classList.remove('show');
    editingId = null;
}

function setPriority(p){
    currentPriority = p;
    updatePriorityBtns();
}

function updatePriorityBtns(){
    document.querySelectorAll('.priority-btn').forEach(function(b){
        b.classList.toggle('active', b.dataset.p === currentPriority);
    });
}
