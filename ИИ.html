<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltMaster AI Assistant</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 1.4rem;
            color: var(--accent-color);
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 6px;
            font-weight: 600;
        }
        .status-loading { background: #eab308; color: #000; }
        .status-success { background: var(--success); color: #000; }
        .status-error { background: var(--danger); color: #fff; }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        textarea {
            width: 100%;
            height: 100px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-main);
            font-size: 1rem;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        .btn {
            background-color: var(--accent-color);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-color);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .result-item .details {
            display: flex;
            flex-direction: column;
        }

        .result-item .sub {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .result-item .price {
            font-weight: 700;
            color: var(--accent-color);
        }

        .total-box {
            margin-top: 10px;
            padding: 12px;
            background-color: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--success);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--success);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>VoltMaster AI Assistant</h1>
        <div id="statusBadge" class="status-badge status-loading">Загрузка prais.html...</div>
    </div>

    <div class="card">
        <label for="inputText">Опишите выполненную работу:</label>
        <textarea id="inputText" placeholder="Например: Розетка 5шт, проложил 25м кабеля и установил 2 автомата"></textarea>
        <button class="btn" onclick="processText()">Посчитать работу</button>
    </div>

    <div class="card" id="outputCard" style="display: none;">
        <label>Распознанные позиции из prais.html:</label>
        <div id="resultsList" class="results"></div>
        <div class="total-box">
            <span>Итого к оплате:</span>
            <span id="grandTotal">0 ₽</span>
        </div>
    </div>
</div>

<script>
    let priceList = [];

    // Загрузка файла prais.html из текущей папки GitHub
    async function loadPrais() {
        const badge = document.getElementById('statusBadge');
        try {
            const response = await fetch('./prais.html', { cache: "no-cache" });
            if (!response.ok) throw new Error('Файл prais.html не найден');

            const htmlText = await response.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, 'text/html');
            
            const rows = doc.querySelectorAll('tr, .price-item, li, div');
            priceList = [];

            rows.forEach((row, idx) => {
                const text = row.innerText ? row.innerText.trim() : '';
                // Поиск цены
                const match = text.match(/(\d[\d\s]*)\s*(?:руб|₽|р)?/i);

                if (match && text.length < 150) {
                    const price = parseFloat(match[1].replace(/\s+/g, ''));
                    let name = text.replace(match[0], '').trim();

                    if (name.length > 2 && !isNaN(price) && price > 0) {
                        // Выделяем ключевые слова из наименования
                        const words = name.toLowerCase()
                            .replace(/[^a-zа-яё0-9]/g, ' ')
                            .split(/\s+/)
                            .filter(w => w.length >= 3);

                        priceList.push({
                            id: 'item_' + idx,
                            name: name,
                            price: price,
                            keywords: words
                        });
                    }
                }
            });

            if (priceList.length > 0) {
                badge.className = 'status-badge status-success';
                badge.innerText = `Прайс подгружен (${priceList.length} позиций)`;
            } else {
                throw new Error('Пустой прайс');
            }

        } catch (err) {
            console.error(err);
            badge.className = 'status-badge status-error';
            badge.innerText = 'Ошибка загрузки prais.html';
        }
    }

    // Алгоритм распознавания кириллицы и количества
    function parseWorkText(text) {
        const cleanedText = text.toLowerCase().replace(/ё/g, 'е');
        const foundItems = [];

        priceList.forEach(item => {
            item.keywords.forEach(keyword => {
                const cleanKeyword = keyword.replace(/ё/g, 'е');
                // Выделяем корень слова для учета окончаний
                const root = cleanKeyword.length > 4 ? cleanKeyword.slice(0, -2) : cleanKeyword.slice(0, -1);
                if (!root || root.length < 3) return;

                // 1. Поиск: число до названия ("5 розеток", "5шт розетка", "25м кабеля")
                const regexBefore = new RegExp(`(\\d+(?:[.,]\\d+)?)\\s*(?:шт|штук|м|метров|метра|п\.м|пог\.м)?\\s*[-—]?\\s*[а-я]*${root}[а-я]*`, 'gi');
                
                // 2. Поиск: название до числа ("Розетка 5шт", "кабель 25 м", "автомат - 2")
                const regexAfter = new RegExp(`[а-я]*${root}[а-я]*\\s*[-—]?\\s*(\\d+(?:[.,]\\d+)?)\\s*(?:шт|штук|м|метров|метра|п\.м|пог\.м)?`, 'gi');

                let match;

                while ((match = regexBefore.exec(cleanedText)) !== null) {
                    const count = parseFloat(match[1].replace(',', '.'));
                    if (count > 0) addOrUpdateItem(foundItems, item, count);
                }

                while ((match = regexAfter.exec(cleanedText)) !== null) {
                    const count = parseFloat(match[1].replace(',', '.'));
                    if (count > 0) addOrUpdateItem(foundItems, item, count);
                }
            });
        });

        return foundItems;
    }

    function addOrUpdateItem(list, item, count) {
        const existing = list.find(i => i.id === item.id);
        if (existing) {
            existing.count = Math.max(existing.count, count);
        } else {
            list.push({
                ...item,
                count: count,
                total: count * item.price
            });
        }
    }

    function processText() {
        const input = document.getElementById('inputText').value;
        const resultsList = document.getElementById('resultsList');
        const grandTotalEl = document.getElementById('grandTotal');
        const outputCard = document.getElementById('outputCard');

        if (!input.trim()) return;

        const items = parseWorkText(input);
        resultsList.innerHTML = '';

        if (items.length === 0) {
            resultsList.innerHTML = '<div style="color: var(--text-muted); text-align: center;">Не удалось распознать позиции из прайса. Проверьте формулировку.</div>';
            grandTotalEl.innerText = '0 ₽';
            outputCard.style.display = 'flex';
            return;
        }

        let totalSum = 0;
        items.forEach(item => {
            totalSum += item.total;
            const row = document.createElement('div');
            row.className = 'result-item';
            row.innerHTML = `
                <div class="details">
                    <span>${item.name}</span>
                    <span class="sub">${item.count} × ${item.price} ₽</span>
                </div>
                <span class="price">${item.total.toLocaleString('ru-RU')} ₽</span>
            `;
            resultsList.appendChild(row);
        });

        grandTotalEl.innerText = `${totalSum.toLocaleString('ru-RU')} ₽`;
        outputCard.style.display = 'flex';
    }

    // Старт чтения прайса при загрузке страницы
    window.onload = loadPrais;
</script>

</body>
</html>
